name: CI

# Gate obrigatório antes de merge (CLAUDE.md, seção 29): lint, type-check,
# testes unitários, testes de integração (contra Supabase local via Docker
# — docs/ARCHITECTURE.md seção 9.6) e build.
#
# Os testes de integração precisam de credenciais reais que NÃO vêm do
# Supabase local (o app usa em runtime, não só em teste): UPSTASH_REDIS_REST_URL/
# TOKEN (rate limiting real, CLAUDE.md seção 3/14.5/28), RSVP_SESSION_SECRET
# (assina o cookie de sessão de RSVP), DRIVE_TOKEN_ENCRYPTION_KEY, CRON_SECRET —
# configurados como GitHub Secrets deste repositório (mesmos valores do
# projeto `dev`, reaproveitados; nunca os de `prod`).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sobe Supabase local (Docker) e aplica migrations
        run: supabase start

      - name: Resolve credenciais do Supabase local para o ambiente do job
        # `supabase status -o env` envolve cada valor em aspas duplas (formato
        # shell-style, ex.: API_URL="http://127.0.0.1:54321"). GITHUB_ENV não
        # remove aspas -- um `cut -d= -f2-` ingênuo grava a aspa como parte
        # literal do valor, e `new URL(process.env.SUPABASE_URL)` (nuxt.config.ts)
        # falha com "Invalid URL" no build seguinte (achado real: primeira
        # execução deste workflow no Actions, docs/PLANO-SAAS.md Passo 2).
        # `tr -d '"'` remove as aspas antes de gravar.
        run: |
          {
            echo "SUPABASE_URL=$(supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '"')"
            echo "SUPABASE_ANON_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '"')"
          } >> "$GITHUB_ENV"

      - run: npm run build

      - name: DEBUG TEMPORARIO -- grants de casamentos no Supabase local
        run: |
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$DB_URL" -c "select grantee, privilege_type from information_schema.role_table_grants where table_name = 'casamentos';"
          psql "$DB_URL" -c "select rolname, rolbypassrls, rolsuper from pg_roles where rolname in ('anon','authenticated','service_role');"
          echo "--- JWT SERVICE_ROLE_KEY decoded payload ---"
          echo "$SUPABASE_SERVICE_ROLE_KEY" | cut -d. -f2 | base64 -d 2>/dev/null || echo "$SUPABASE_SERVICE_ROLE_KEY" | cut -d. -f2 | tr '_-' '/+' | base64 -d 2>/dev/null
          echo

      - name: Testes de integração (RLS, guest-path, API — contra o Supabase local)
        run: npm run test:integration -- --run
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          RSVP_SESSION_SECRET: ${{ secrets.RSVP_SESSION_SECRET }}
          DRIVE_TOKEN_ENCRYPTION_KEY: ${{ secrets.DRIVE_TOKEN_ENCRYPTION_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Encerra Supabase local
        if: always()
        run: supabase stop
