name: CI

# Gate obrigatório antes de merge (CLAUDE.md, seção 29): lint, type-check,
# testes unitários, testes de integração (contra Supabase local via Docker
# — docs/ARCHITECTURE.md seção 9.6) e build.
#
# Os testes de integração precisam de credenciais reais que NÃO vêm do
# Supabase local (o app usa em runtime, não só em teste): UPSTASH_REDIS_REST_URL/
# TOKEN (rate limiting real, CLAUDE.md seção 3/14.5/28), RSVP_SESSION_SECRET
# (assina o cookie de sessão de RSVP), DRIVE_TOKEN_ENCRYPTION_KEY,
# ACCESS_CODE_ENCRYPTION_KEY (cifra o código de acesso do convite: sem ela
# POST /api/guest-access-tokens responde 500, achado real deste workflow),
# CRON_SECRET — configurados como GitHub Secrets deste repositório (mesmos
# valores do projeto `dev`, reaproveitados; nunca os de `prod`).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - uses: supabase/setup-cli@v1
        with:
          # Pinada, não `latest`: o gate de tipos abaixo depende do formato de
          # saída do gerador, e `latest` mudaria esse formato sem ninguém
          # pedir, num PR que não encostou no banco. Subir a versão é uma
          # decisão revisável, não um efeito colateral de um release da
          # Supabase.
          version: 2.110.0

      - name: Sobe Supabase local (Docker) e aplica migrations
        run: supabase start

      - name: Gate — database.types.ts em dia com as migrations
        # O arquivo é gerado pela CLI e nunca editado à mão (CLAUDE.md seção
        # 8), mas nada impedia um PR de adicionar uma migration e esquecer de
        # regenerá-lo: o TypeScript seguia compilando contra um schema que já
        # não existe, e o erro só aparecia em runtime.
        #
        # A fonte de verdade aqui é o banco montado pelas próprias migrations
        # (`--local`), não o projeto hospedado — é isso que torna o gate capaz
        # de pegar drift entre os dois.
        #
        # A comparação é sobre o recorte de schema dos dois arquivos, não
        # sobre os arquivos inteiros: a mesma CLI emite boilerplate diferente
        # conforme a versão do PostgREST que detecta, e o hospedado difere do
        # stack local. `scripts/schema-types-fingerprint.mjs` documenta o
        # recorte e por que ele não perde nada de schema.
        run: |
          supabase gen types typescript --local > /tmp/database.types.generated.ts
          node scripts/schema-types-fingerprint.mjs app/types/database.types.ts > /tmp/fingerprint.committed
          node scripts/schema-types-fingerprint.mjs /tmp/database.types.generated.ts > /tmp/fingerprint.generated
          if ! diff -u /tmp/fingerprint.committed /tmp/fingerprint.generated \
               --label 'app/types/database.types.ts (commitado)' \
               --label 'gerado a partir das migrations'; then
            echo "::error::app/types/database.types.ts está desatualizado em relação às migrations. Rode 'npx supabase gen types typescript --linked > app/types/database.types.ts' contra um projeto com todas as migrations aplicadas e commite o resultado."
            exit 1
          fi

      - name: Resolve credenciais do Supabase local para o ambiente do job
        # `supabase status -o env` envolve cada valor em aspas duplas (formato
        # shell-style, ex.: API_URL="http://127.0.0.1:54321"). GITHUB_ENV não
        # remove aspas -- um `cut -d= -f2-` ingênuo grava a aspa como parte
        # literal do valor, e `new URL(process.env.SUPABASE_URL)` (nuxt.config.ts)
        # falha com "Invalid URL" no build seguinte (achado real: primeira
        # execução deste workflow no Actions, docs/PLANO-SAAS.md Passo 2).
        # `tr -d '"'` remove as aspas antes de gravar.
        run: |
          {
            echo "SUPABASE_URL=$(supabase status -o env | grep '^API_URL=' | cut -d= -f2- | tr -d '"')"
            echo "SUPABASE_ANON_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d= -f2- | tr -d '"')"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o env | grep '^SERVICE_ROLE_KEY=' | cut -d= -f2- | tr -d '"')"
          } >> "$GITHUB_ENV"

      - run: npm run build

      - name: Testes de integração (RLS, guest-path, API — contra o Supabase local)
        run: npm run test:integration -- --run
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          RSVP_SESSION_SECRET: ${{ secrets.RSVP_SESSION_SECRET }}
          DRIVE_TOKEN_ENCRYPTION_KEY: ${{ secrets.DRIVE_TOKEN_ENCRYPTION_KEY }}
          ACCESS_CODE_ENCRYPTION_KEY: ${{ secrets.ACCESS_CODE_ENCRYPTION_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}

      - name: Encerra Supabase local
        if: always()
        run: supabase stop
